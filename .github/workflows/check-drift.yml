name: Check betalingskenmerk drift

on:
  schedule:
    - cron: '17 6 * * *'   # daily, 06:17 UTC
  workflow_dispatch: {}     # allows a manual "Run workflow" from the Actions tab

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run drift check
        run: node check-drift.mjs > status.json

      - name: Show result
        run: cat status.json

      - name: Commit status.json if changed
        run: |
          git config user.name "drift-check-bot"
          git config user.email "actions@users.noreply.github.com"
          git add status.json
          git diff --staged --quiet || git commit -m "chore: update drift-check status"
          git push
